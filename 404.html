<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Roboto+Mono');

        /* CSS Styles */
        html, body {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
        }

        html {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .copy-container {
            text-align: center;
            position: relative;
        }

        p {
            color: #fff;
            font-size: 24px;
            letter-spacing: .2px;
            margin: 0;
            display: inline-block; /* Keeps spans together */
        }

        /* Each character will be wrapped in this */
        .char {
            display: inline-block;
            opacity: 0; /* Start hidden */
        }

        .handle {
            background: #ffe500;
            width: 14px;
            height: 30px;
            display: inline-block;
            vertical-align: bottom; /* Aligns with text */
            margin-left: 5px; /* Spacing from text */
            opacity: 0;
        }

        #cb-replay {
            fill: #666;
            width: 20px;
            position: absolute;
            right: 20px;
            bottom: 20px;
            cursor: pointer;
        }

        #cb-replay:hover {
            fill: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="copy-container">
            <p id="myText">404, page not found.</p>
            <span class="handle"></span>
        </div>
    </div>

    <svg version="1.1" id="cb-replay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 279.9 297.3">
        <g>
            <path d="M269.4,162.6c-2.7,66.5-55.6,120.1-121.8,123.9c-77,4.4-141.3-60-136.8-136.9C14.7,81.7,71,27.8,140,27.8 c1.8,0,3.5,0,5.3,0.1c0.3,0,0.5,0.2,0.5,0.5v15c0,1.5,1.6,2.4,2.9,1.7l35.9-20.7c1.3-0.7,1.3-2.6,0-3.3L148.6,0.3 c-1.3-0.7-2.9,0.2-2.9,1.7v15c0,0.3-0.2,0.5-0.5,0.5c-1.7-0.1-3.5-0.1-5.2-0.1C63.3,17.3,1,78.9,0,155.4 C-1,233.8,63.4,298.3,141.9,297.3c74.6-1,135.1-60.2,138-134.3c0.1-3-2.3-5.4-5.3-5.4l0,0C271.8,157.6,269.5,159.8,269.4,162.6z"/>
        </g>
    </svg>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // 1. Manually split text (replaces the paid SplitText plugin)
        const textElement = document.getElementById('myText');
        const textContent = textElement.textContent;
        textElement.innerHTML = ''; // Clear text

        const chars = [];
        
        // Wrap every character in a span
        textContent.split('').forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            span.className = 'char';
            // Preserve spaces
            if (char === ' ') {
                span.style.width = '0.5em'; 
            }
            textElement.appendChild(span);
            chars.push(span);
        });

        // 2. Define Animations
        const tl = gsap.timeline();

        // Cursor blinking animation
        gsap.to('.handle', {
            opacity: 1,
            duration: 0.4,
            repeat: -1,
            yoyo: true,
            ease: "steps(1)" // Makes it blink sharply like a cursor
        });

        function animateText() {
            // Reset opacity for replay
            gsap.set(chars, { opacity: 0 });
            
            // Typewriter effect
            tl.restart();
            tl.clear();
            
            tl.to(chars, {
                duration: 0.05,
                opacity: 1,
                stagger: 0.1, // Delay between each character
                ease: "none",
            });
        }

        // 3. Start Animation
        // Small delay before starting so the page loads cleanly
        setTimeout(animateText, 500);

        // 4. Replay Button Logic
        document.getElementById('cb-replay').addEventListener('click', function() {
            animateText();
        });

    </script>
</body>
</html>
